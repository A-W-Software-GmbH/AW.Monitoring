services:
  grafana:
    image: ${DOCKER_REGISTRY-}grafana:${MONITORING_VERSION-latest}
    build:
      context: ./grafana
      dockerfile: ./Dockerfile
      tags:
        - ${DOCKER_REGISTRY-}grafana:latest
      args:
        - IMAGE_PATH=${SERVERCORE_IMAGE_PATH}
        - IMAGE_VERSION=${SERVERCORE_IMAGE_VERSION}
        - GRAFANA_VERSION=13.3.0
        - INFINITY_DATASOURCE_VERSION=4.1.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2g
    ports:
      - "23000:3000"
    environment:
      # Set GRAFANA_PROTOCOL=https and drop your cert/key into ./grafana/certs
      # (or point GRAFANA_CERTS_DIR elsewhere) to serve Grafana over TLS.
      - GF_SERVER_PROTOCOL=${GRAFANA_PROTOCOL:-http}
      - GF_SERVER_CERT_FILE=C:\grafana\certs\${GRAFANA_CERT_FILENAME:-server.crt}
      - GF_SERVER_CERT_KEY=C:\grafana\certs\${GRAFANA_CERT_KEYNAME:-server.key}
      # conf.ini's root_url = %(protocol)s://%(domain)s:23000/ interpolates from the ini
      # file's own (commented-out) protocol/domain values, NOT from GF_SERVER_PROTOCOL above
      # - so with only that env var set, Grafana still advertises http://localhost:23000/
      # internally even while actually serving HTTPS, and browsers flag the page "Not secure"
      # due to the resulting mixed-content links. Setting GF_SERVER_DOMAIN/GF_SERVER_ROOT_URL
      # directly bypasses the broken ini interpolation.
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_ROOT_URL=${GRAFANA_PROTOCOL:-http}://${GRAFANA_DOMAIN:-localhost}:23000/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -k -f %GF_SERVER_PROTOCOL%://localhost:3000/api/health || exit 1",
        ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus
      - loki
      - tempo
    isolation: process
    restart: unless-stopped
    command:
      - "--homepath=C:\\grafana"
      - "--config=C:\\grafana\\conf\\custom.ini"
    volumes:
      - ./grafana/provisioning:C:/grafana/provisioning:ro
      - ${GRAFANA_CERTS_DIR:-./grafana/certs}:C:/grafana/certs:ro
      - grafana-data:C:/grafana/data:rw
      - grafana-logs:C:/grafana/logs:rw
    networks:
      - monitoring

  prometheus:
    image: ${DOCKER_REGISTRY-}prometheus:${MONITORING_VERSION-latest}
    build:
      context: ./prometheus
      dockerfile: ./Dockerfile
      tags:
        - ${DOCKER_REGISTRY-}prometheus:latest
      args:
        - IMAGE_PATH=${SERVERCORE_IMAGE_PATH}
        - IMAGE_VERSION=${SERVERCORE_IMAGE_VERSION}
        - DOWNLOADER_IMAGE_PATH=${DOWNLOADER_IMAGE_PATH}
        - DOWNLOADER_IMAGE_VERSION=${DOWNLOADER_IMAGE_VERSION}
        - PROMETHEUS_VERSION=3.15.1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4g
    isolation: process
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "curl -k -f http://localhost:9090/-/healthy || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - ./prometheus/config:C:/prometheus/config:ro
      - prometheus-data:C:/d:rw
    user: ContainerAdministrator
    command:
      - "--storage.tsdb.path=C:\\d"
      - "--config.file=C:\\prometheus\\config\\prometheus.yaml"
      - "--web.enable-otlp-receiver"
      - "--log.level=debug"
      # - "--enable-feature=otlp-write-receiver"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"
      #- "--web.enable-remote-write-receiver"
    networks:
      - monitoring
    #ports:
    #  - "39090:9090" # Prometheus web UI

  loki:
    image: ${DOCKER_REGISTRY-}loki:${MONITORING_VERSION-latest}
    isolation: process
    restart: unless-stopped
    build:
      context: ./loki
      dockerfile: ./Dockerfile
      tags:
        - ${DOCKER_REGISTRY-}loki:latest
      args:
        - IMAGE_PATH=${NANOSERVER_IMAGE_PATH}
        - IMAGE_VERSION=${NANOSERVER_IMAGE_VERSION}
        - DOWNLOADER_IMAGE_PATH=${DOWNLOADER_IMAGE_PATH}
        - DOWNLOADER_IMAGE_VERSION=${DOWNLOADER_IMAGE_VERSION}
        - LOKI_VERSION=3.7.9
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2g
    volumes:
      - ./loki/config:C:/loki/config:ro
      - loki-storage:C:/d:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f http://localhost:3100/ready || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    command:
      - "-config.file=C:\\loki\\config\\loki.yaml"
      - "-print-config-stderr"
    networks:
      - monitoring

  tempo:
    image: ${DOCKER_REGISTRY-}tempo:${MONITORING_VERSION-latest}
    isolation: process
    restart: unless-stopped
    build:
      context: ./tempo
      dockerfile: ./Dockerfile
      tags:
        - ${DOCKER_REGISTRY-}tempo:latest
      args:
        - IMAGE_PATH=${NANOSERVER_IMAGE_PATH}
        - IMAGE_VERSION=${NANOSERVER_IMAGE_VERSION}
        - DOWNLOADER_IMAGE_PATH=${DOWNLOADER_IMAGE_PATH}
        - DOWNLOADER_IMAGE_VERSION=${DOWNLOADER_IMAGE_VERSION}
        - TEMPO_VERSION=3.1.1
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f http://localhost:3200/ready || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - ./tempo/config:C:/tempo/config:ro
      - tempo-storage:C:/tempo/traces:rw
    command: ["-config.file=C:\\tempo\\config\\tempo.yaml"]
    networks:
      - monitoring

  otel-collector:
    image: ${DOCKER_REGISTRY-}collector:${MONITORING_VERSION-latest}
    isolation: process
    restart: unless-stopped
    build:
      context: ./otel-collector
      dockerfile: ./Dockerfile
      tags:
        - ${DOCKER_REGISTRY-}collector:latest
      args:
        - IMAGE_PATH=${SERVERCORE_IMAGE_PATH}
        - IMAGE_VERSION=${SERVERCORE_IMAGE_VERSION}
        - DOWNLOADER_IMAGE_PATH=${DOWNLOADER_IMAGE_PATH}
        - DOWNLOADER_IMAGE_VERSION=${DOWNLOADER_IMAGE_VERSION}
        - COLLECTOR_VERSION=0.164.0
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2g
    command: ["--config=C:\\collector\\config\\otel-colector.config.yaml"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -k -f http://localhost:13133/health/status || exit 1",
        ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - ./otel-collector/config:C:/collector/config:ro
    ports:
      - "34317:4317" # OTLP gRPC receiver
      - "34318:4318" # OTLP HTTP receiver
      #- "33133:13133" # Health check endpoint
    networks:
      - monitoring

  mcp-grafana:
    profiles:
      - mcp
    image: ${DOCKER_REGISTRY-}mcp-grafana:${MONITORING_VERSION-latest}
    isolation: process
    restart: unless-stopped
    build:
      context: ./mcp-grafana
      dockerfile: ./Dockerfile
      tags:
        - ${DOCKER_REGISTRY-}mcp-grafana:latest
      args:
        - IMAGE_PATH=${NANOSERVER_IMAGE_PATH}
        - IMAGE_VERSION=${NANOSERVER_IMAGE_VERSION}
        - DOWNLOADER_IMAGE_PATH=${DOWNLOADER_IMAGE_PATH}
        - DOWNLOADER_IMAGE_VERSION=${DOWNLOADER_IMAGE_VERSION}
        - MCP_GRAFANA_VERSION=2.2.0
    depends_on:
      - grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2g
    env_file:
      - user.env
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f http://localhost:8000/healthz || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "38000:8000" # mcp-grafana port
    networks:
      - monitoring

  # k6-tracing:
  #   image: ghcr.io/grafana/xk6-client-tracing:v0.0.5
  #   environment:
  #     - ENDPOINT=otel-collector:4317
  #   restart: always
  #   depends_on:
  #     - otel-collector
  #   networks:
  #     - monitoring

volumes:
  prometheus-data:
    external: false
    labels:
      - aw-monitoring
  grafana-logs:
    external: false
    labels:
      - aw-monitoring
  grafana-data:
    external: false
    labels:
      - aw-monitoring
  loki-storage:
    external: false
    labels:
      - aw-monitoring
  tempo-storage:
    external: false
    labels:
      - aw-monitoring
networks:
  monitoring:
    name: nat
    external: true
    labels:
      - aw-monitoring
